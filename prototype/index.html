  --space: 1;

  --gap-module: calc(26px * var(--space));
  --gap: calc(14px * var(--space));
  --gap-sm: calc(9px * var(--space));

  --radius-window: 24px;
  --radius-card: 18px;
  --radius-pill: 999px;

  /* holo intensity 0..1 */
  --holo-alpha: 0.85;

  /* ===== Soft Pixel Romance ===== */
  --bg: oklch(0.93 0.025 339);
  --bg-deep: oklch(0.9 0.035 332);
  --surface: oklch(0.95 0.045 86);
  --surface-2: oklch(0.97 0.03 86);
  --ink: oklch(0.31 0.06 318);
  --muted: oklch(0.5 0.055 318);
  --primary: oklch(0.56 0.115 312);
  --primary-deep: oklch(0.48 0.115 312);
  --primary-fg: oklch(0.98 0.012 86);
  --secondary: oklch(0.84 0.075 343);
  --accent: oklch(0.8 0.075 311);
  --border: oklch(0.85 0.05 330);
  --input-bg: oklch(0.98 0.018 86);
  --online: oklch(0.72 0.15 155);
  --match: oklch(0.84 0.075 343);

  --pastel-aqua: oklch(0.86 0.06 190);
  --pastel-sky: oklch(0.84 0.06 245);
  --pastel-butter: oklch(0.92 0.06 95);
  --pastel-rose: oklch(0.86 0.07 343);
  --pastel-lilac: oklch(0.82 0.075 311);

  --holo: linear-gradient(
    115deg,
    var(--pastel-aqua) 0%,
    var(--pastel-lilac) 22%,
    var(--pastel-rose) 46%,
    var(--pastel-butter) 70%,

    inset 0 -2px 5px oklch(0.4 0.06 318 / 0.07),
    0 14px 34px -14px oklch(0.4 0.06 318 / 0.3);

/* ============ base ============ */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  transition: background 0.35s ease, color 0.35s ease;
}

/* dreamy holographic wash behind everything */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: calc(0.22 * var(--holo-alpha));
  background:
    radial-gradient(42% 36% at 12% 8%, var(--pastel-lilac), transparent 70%),
    radial-gradient(46% 38% at 88% 18%, var(--pastel-aqua), transparent 70%),
    radial-gradient(50% 42% at 22% 92%, var(--pastel-butter), transparent 70%),
    radial-gradient(44% 38% at 86% 84%, var(--pastel-rose), transparent 70%);
}

h1, h2, h3, h4 {
  font-family: var(--font-heading);
  line-height: 1.15;
  margin: 0;
  text-wrap: balance;
}

p { margin: 0; text-wrap: pretty; }

button {
  font-family: inherit;
  cursor: pointer;
}

input, textarea {
  font-family: inherit;
}

img { display: block; max-width: 100%; }

::selection { background: var(--accent); color: var(--ink); }

/* ============ layout ============ */

.mm-page {
  max-width: 640px;
  margin: 0 auto;
  padding: var(--pad-page);
  padding-bottom: calc(var(--pad-page) * 3);
  display: flex;
  flex-direction: column;
  gap: var(--gap-module);
}

@media (min-width: 980px) {
  .mm-page.mm-page-wide { max-width: 1024px; }
}

/* ============ window module ============ */

.mm-window {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-window);
  box-shadow: var(--shadow-window);
  overflow: hidden;
  transition: background 0.35s ease, border-color 0.35s ease;
}

.mm-titlebar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(11px * var(--space)) calc(18px * var(--space));
  background: var(--primary);
  color: var(--primary-fg);
  position: relative;
}

.mm-titlebar.mm-titlebar-soft {
  background: var(--surface-2);
  color: var(--ink);
  border-bottom: 1px solid var(--border);
}

/* iridescent hairline under the titlebar */
.mm-titlebar::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: -2px;
  height: 2px;
  background: var(--holo);
  opacity: var(--holo-alpha);
}

.mm-titlebar-text {
  flex: 1;
  min-width: 0;
  font-family: var(--font-mono);
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mm-window-dots {
  display: flex;
  gap: 5px;
  flex: none;
}
.mm-window-dots span {
  width: 9px; height: 9px;
  border-radius: 3px;
  background: currentColor;
  opacity: 0.32;
}
.mm-window-dots span:last-child {
  background: transparent;
  border: 1.5px solid currentColor;
  opacity: 0.45;
}

.mm-window-body {
  padding: var(--pad-window);
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  background-image: linear-gradient(to bottom, oklch(1 0 0 / 0.28), oklch(1 0 0 / 0) 56px);
}

.mm-window-body.mm-flush { padding: 0; gap: 0; }

/* ============ buttons ============ */

.mm-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 15.5px;
  padding: calc(12px * var(--space)) calc(22px * var(--space));
  min-height: 46px;
  text-decoration: none;
  position: relative;
  overflow: hidden;
  transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}
.mm-btn:active { transform: scale(0.97); }

.mm-btn-primary {
  background: linear-gradient(to bottom, oklch(1 0 0 / 0.22), oklch(1 0 0 / 0) 55%) , var(--primary);
  color: var(--primary-fg);
  box-shadow: var(--shadow-soft), inset 0 1px 0 oklch(1 0 0 / 0.35);
}
.mm-btn-primary:hover { background: linear-gradient(to bottom, oklch(1 0 0 / 0.3), oklch(1 0 0 / 0) 55%), var(--primary-deep); }

/* holo sheen sweep on hover */
.mm-btn-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--holo);
  opacity: 0;
  mix-blend-mode: soft-light;
  transition: opacity 0.25s ease;
}
.mm-btn-primary:hover::after { opacity: var(--holo-alpha); }

.mm-btn-ghost {
  background: var(--surface-2);
  color: var(--ink);
  border-color: var(--border);
  box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.5);
}
.mm-btn-ghost:hover { border-color: var(--primary); }

.mm-btn-sm {
  min-height: 38px;
  padding: calc(8px * var(--space)) calc(16px * var(--space));
  font-size: 14px;
}

.mm-btn:focus-visible,
.mm-chip:focus-visible,
.mm-icon-btn:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.mm-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px; height: 44px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink);
  transition: border-color 0.15s ease, transform 0.12s ease;
}
.mm-icon-btn:hover { border-color: var(--primary); }
.mm-icon-btn:active { transform: scale(0.94); }

/* ============ chips ============ */

.mm-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--gap-sm);
}

.mm-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink);
  font-family: var(--font-heading);
  font-weight: 500;
  font-size: 14px;
  padding: calc(7px * var(--space)) calc(15px * var(--space));
  min-height: 38px;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
}
button.mm-chip:hover { border-color: var(--primary); }
button.mm-chip:active { transform: scale(0.96); }

.mm-chip.mm-chip-on {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-fg);
  box-shadow: var(--shadow-soft);
}

.mm-chip.mm-chip-soft {
  background: color-mix(in oklch, var(--secondary) 45%, var(--surface-2));
  border-color: color-mix(in oklch, var(--secondary) 70%, var(--border));
}

/* ============ inputs ============ */

.mm-input, .mm-textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--input-bg);
  color: var(--ink);
  font-size: 16px;
  padding: calc(12px * var(--space)) calc(16px * var(--space));
  box-shadow: inset 0 2px 4px oklch(0.4 0.06 318 / 0.06);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.mm-input:focus, .mm-textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: inset 0 2px 4px oklch(0.4 0.06 318 / 0.06), 0 0 0 3px color-mix(in oklch, var(--primary) 25%, transparent);
}
.mm-input::placeholder, .mm-textarea::placeholder { color: var(--muted); opacity: 0.75; }

.mm-textarea { resize: vertical; min-height: 86px; }

.mm-label {
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 14.5px;
  display: block;
  margin-bottom: 6px;
}

.mm-hint {
  font-size: 13px;
  color: var(--muted);
  margin-top: 6px;
}

/* ============ misc ============ */

.mm-muted { color: var(--muted); }
.mm-mono { font-family: var(--font-mono); }

.mm-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--primary);
}

/* holo ring avatar */
.mm-avatar {
  position: relative;
  flex: none;
  border-radius: 18px;
  padding: 2.5px;
  background: var(--holo);
  box-shadow: var(--shadow-soft);
}
.mm-avatar > img, .mm-avatar > .mm-avatar-letter {
  width: 100%; height: 100%;
  border-radius: 15px;
  object-fit: cover;
}
.mm-avatar-letter {
  display: grid;
  place-items: center;
  background: var(--secondary);
  color: var(--ink);
  font-family: var(--font-heading);
  font-weight: 700;
}
.mm-avatar .mm-online-dot {
  position: absolute;
  right: -3px; bottom: -3px;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: var(--online);
  border: 2.5px solid var(--surface);
}

/* holo text (used sparingly) */
.mm-holo-text {
  background: linear-gradient(100deg, var(--primary), color-mix(in oklch, var(--pastel-rose) 60%, var(--primary)), var(--primary-deep));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* progress bar */
.mm-progress-track {
  height: 9px;
  border-radius: 99px;
  background: color-mix(in oklch, var(--border) 60%, transparent);
  overflow: hidden;
  flex: 1;
}
.mm-progress-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--holo);
  box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.25);
  transition: width 0.4s ease;
}

/* divider */
.mm-divider {
  border: none;
  border-top: 1px dashed var(--border);
  margin: calc(4px * var(--space)) 0;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
@keyframes mmFade { from { opacity: 0; } to { opacity: 1; } }
</style>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function ReelBuilderScreen({ go, toast }) {

  const update = (i, patch) => setFrames((f) => f.map((fr, j) => (j === i ? { ...fr, ...patch } : fr)));
  const move = (i, dir) => setFrames((f) => {
    const j = i + dir;
    if (j < 0 || j >= f.length) return f;
    const n = [...f]; [n[i], n[j]] = [n[j], n[i]];
    setSel(j);
    return n;
  });
  const remove = (i) => setFrames((f) => { const n = f.filter((_, j) => j !== i); setSel(Math.max(0, Math.min(sel, n.length - 1))); return n; });
  const add = (clip) => setFrames((f) => { setSel(f.length); return [...f, { src: clip.src, caption: '', duration: 4 }]; });

  const total = frames.reduce((s, f) => s + f.duration, 0);
  const selFrame = frames[sel];
  const beatObj = D.beats.find((b) => b.id === beat);

  return (
    <main className="mm-page" data-screen-label="Reel Builder">
      <section style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
        <h1 style={{ fontSize: '32px', fontWeight: 700, letterSpacing: '-0.01em' }}>Build your memory reel</h1>
        <p className="mm-muted" style={{ fontSize: '15.5px', maxWidth: '54ch' }}>
          Stitch a few moments together, pick a beat, and tell a tiny story. No pressure to be perfect — messy and honest reads best.
        </p>
      </section>

      {/* live preview */}
      {frames.length > 0 && (
        <Y2KWindow title="live-preview.exe" icon={<PixelDisc size={14}></PixelDisc>} flush>
          <ReelPlayer key={frames.map((f) => f.src + f.caption + f.duration).join('|')} frames={frames} beatLabel={beatObj.title}></ReelPlayer>
        </Y2KWindow>
      )}

      {/* frames */}
      <Y2KWindow title={'frames · ' + frames.length} icon={<PixelSparkle size={14}></PixelSparkle>}>
        {frames.map((f, i) => (
          <div
            key={f.src + i}
            onClick={() => setSel(i)}
            style={{
              display: 'flex', alignItems: 'center', gap: 'var(--gap)', cursor: 'pointer',
              background: sel === i ? 'color-mix(in oklch, var(--primary) 10%, var(--surface-2))' : 'var(--surface-2)',
              border: '1.5px solid ' + (sel === i ? 'var(--primary)' : 'var(--border)'),
              borderRadius: 'var(--radius-card)', padding: 'calc(11px * var(--space)) calc(13px * var(--space))',
              transition: 'border-color 0.15s ease, background 0.15s ease',
            }}
          >
            <span style={{ position: 'relative', flex: 'none' }}>
              <img src={f.src} alt="" style={{ width: '58px', height: '58px', objectFit: 'cover', borderRadius: '14px' }}></img>
              <span className="mm-mono" style={{ position: 'absolute', top: '-6px', left: '-6px', display: 'grid', placeItems: 'center', width: '22px', height: '22px', borderRadius: '8px', background: 'var(--primary)', color: 'var(--primary-fg)', fontSize: '11px', fontWeight: 700 }}>{i + 1}</span>
            </span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <p style={{ fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: '15px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: f.caption ? 'var(--ink)' : 'var(--muted)' }}>
                {f.caption || 'no caption yet'}
              </p>
              <p className="mm-mono mm-muted" style={{ fontSize: '12px' }}>{f.duration}s</p>
            </div>
            <div style={{ display: 'flex', gap: '6px' }}>
              <button className="mm-icon-btn" style={{ width: '36px', height: '36px' }} aria-label="Move frame up" onClick={(e) => { e.stopPropagation(); move(i, -1); }}>↑</button>
              <button className="mm-icon-btn" style={{ width: '36px', height: '36px' }} aria-label="Move frame down" onClick={(e) => { e.stopPropagation(); move(i, 1); }}>↓</button>
              <button className="mm-icon-btn" style={{ width: '36px', height: '36px' }} aria-label="Delete frame" onClick={(e) => { e.stopPropagation(); remove(i); }}>✕</button>
            </div>
          </div>
        ))}
        <p className="mm-mono mm-muted" style={{ fontSize: '12px' }}>total reel length: {total}s</p>
      </Y2KWindow>

      {/* frame details */}
      {selFrame && (
        <Y2KWindow title={'frame-' + (sel + 1) + '-details.cfg'} soft icon={<PixelStar size={14}></PixelStar>}>
          <div>
            <label className="mm-label" htmlFor="rb-caption">Caption</label>
            <input id="rb-caption" className="mm-input" placeholder="say something about this moment…" value={selFrame.caption} onChange={(e) => update(sel, { caption: e.target.value })}></input>
          </div>
          <div>
            <label className="mm-label" htmlFor="rb-duration" style={{ display: 'flex', justifyContent: 'space-between' }}>
              <span>Duration</span>
              <span className="mm-mono" style={{ color: 'var(--primary)' }}>{selFrame.duration}s</span>
            </label>
            <input id="rb-duration" type="range" min="1" max="6" step="1" value={selFrame.duration} onChange={(e) => update(sel, { duration: +e.target.value })} style={{ width: '100%', accentColor: 'var(--primary)' }}></input>
          </div>
        </Y2KWindow>
      )}

      {/* clips */}
      <Y2KWindow title="add-from-your-clips" icon={<PixelSparkle size={14}></PixelSparkle>}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 'var(--gap-sm)' }}>
          {D.clips.map((c) => (
            <button key={c.src} onClick={() => add(c)} aria-label={'Add ' + c.label} style={{ position: 'relative', background: 'none', border: 'none', padding: 0, cursor: 'pointer', borderRadius: '16px', overflow: 'hidden', boxShadow: 'var(--shadow-soft)' }}>
              <img src={c.src} alt={c.label} style={{ width: '100%', aspectRatio: '1', objectFit: 'cover', transition: 'transform 0.2s ease' }}></img>
              <span style={{ position: 'absolute', right: '7px', bottom: '7px', display: 'grid', placeItems: 'center', width: '26px', height: '26px', borderRadius: '9px', background: 'var(--primary)', color: 'var(--primary-fg)', fontWeight: 700, fontSize: '15px' }}>+</span>
            </button>
          ))}
        </div>
      </Y2KWindow>

      {/* beat */}
      <Y2KWindow title="background-beat.m3u" icon={<PixelDisc size={14}></PixelDisc>}>
        <p className="mm-muted" style={{ fontSize: '13.5px' }}>Hand-made loops. Audio stays muted until someone taps play — it never autoplays.</p>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 'var(--gap-sm)' }}>
          {D.beats.map((b) => (
            <button
              key={b.id}
              onClick={() => setBeat(b.id)}
              aria-pressed={beat === b.id}
              style={{
                display: 'flex', alignItems: 'center', gap: '11px', textAlign: 'left', cursor: 'pointer',
                background: beat === b.id ? 'color-mix(in oklch, var(--primary) 10%, var(--surface-2))' : 'var(--surface-2)',
                border: '1.5px solid ' + (beat === b.id ? 'var(--primary)' : 'var(--border)'),
                borderRadius: 'var(--radius-card)', padding: 'calc(12px * var(--space))', color: 'var(--ink)',
                transition: 'border-color 0.15s ease, background 0.15s ease',
              }}
            >
              <span style={{ display: 'grid', placeItems: 'center', flex: 'none', width: '36px', height: '36px', borderRadius: '50%', background: beat === b.id ? 'var(--holo)' : 'var(--secondary)', color: 'var(--ink)' }}>
                <PixelDisc size={15}></PixelDisc>
              </span>
              <span style={{ minWidth: 0 }}>
                <span style={{ display: 'block', fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: '14px' }}>{b.title}</span>
                <span className="mm-muted" style={{ display: 'block', fontSize: '12px' }}>{b.vibe}</span>
              </span>
            </button>
          ))}
        </div>
      </Y2KWindow>

      <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
        <button className="mm-btn mm-btn-primary" onClick={() => { toast('Reel saved ✦'); go('vibe'); }}>
          <PixelDisc size={15}></PixelDisc> Save reel
        </button>
        <p className="mm-muted" style={{ fontSize: '12.5px', textAlign: 'center' }}>
          <PixelStar size={11} style={{ color: 'var(--primary)' }}></PixelStar> You can re-edit your reel anytime.
        </p>
      </div>
    </main>
  );
}

Object.assign(window, { OnboardingScreen, ReelBuilderScreen });
})();
</script>
<script type="text/babel">
// MemoryMatch — app shell: routing, theming, tweaks
(() => {
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "soft-pixel-romance",
  "headingFont": "Baloo 2",
  "holo": 85,
  "spacing": "roomy"
}/*EDITMODE-END*/;

const SPACING = { cozy: 0.85, roomy: 1, airy: 1.18 };

const ROUTES = ['landing', 'browse', 'vibe', 'chemistry', 'onboarding', 'reel'];

function useHashRoute() {
  const initial = () => {
    const h = window.location.hash.replace(/^#\/?/, '');
    return ROUTES.includes(h) ? h : 'landing';
  };
  const [route, setRoute] = useState(initial);
  useEffect(() => {
    const onHash = () => setRoute(initial());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const go = (r) => {
    window.location.hash = '/' + r;
    window.scrollTo({ top: 0 });
  };
  return [route, go];
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, go] = useHashRoute();
  const [toastNode, toast] = useToast();

  // apply theme + tweak vars to document
  useEffect(() => {
    const root = document.documentElement;
    if (t.theme === 'soft-pixel-romance') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', t.theme);
    root.style.setProperty('--holo-alpha', String(t.holo / 100));
    root.style.setProperty('--space', String(SPACING[t.spacing] || 1));
    root.style.setProperty('--font-heading', `'${t.headingFont}', system-ui, sans-serif`);
  }, [t.theme, t.holo, t.spacing, t.headingFont]);

  const screens = {
    landing: <LandingScreen go={go}></LandingScreen>,
    browse: <BrowseScreen go={go} toast={toast}></BrowseScreen>,
    vibe: <VibeScreen go={go} toast={toast}></VibeScreen>,
    chemistry: <ChemistryScreen go={go} toast={toast}></ChemistryScreen>,
    onboarding: <OnboardingScreen go={go} toast={toast} theme={t.theme} setTheme={(v) => setTweak('theme', v)}></OnboardingScreen>,
    reel: <ReelBuilderScreen go={go} toast={toast}></ReelBuilderScreen>,
  };

  return (
    <React.Fragment>
      <SiteHeader route={route} go={go}></SiteHeader>
      {screens[route]}

      {/* prototype screen switcher */}
      <nav
        aria-label="Prototype screens"
        style={{
          position: 'fixed', bottom: '14px', left: '50%', transform: 'translateX(-50%)', zIndex: 60,
          display: 'flex', gap: '4px', padding: '6px',
          background: 'color-mix(in oklch, var(--surface) 88%, transparent)',
          backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)',
          border: '1px solid var(--border)', borderRadius: '999px', boxShadow: 'var(--shadow-soft)',
          maxWidth: 'calc(100vw - 24px)', overflowX: 'auto',
        }}
      >
        {[['landing', 'home'], ['onboarding', 'setup'], ['reel', 'reel'], ['vibe', 'vibe'], ['browse', 'browse'], ['chemistry', 'match']].map(([r, label]) => (
          <button
            key={r}
            onClick={() => go(r)}
            style={{
              border: 'none', borderRadius: '999px', padding: '7px 13px', fontSize: '12.5px',
              fontFamily: 'var(--font-mono)', fontWeight: 700, letterSpacing: '0.03em', whiteSpace: 'nowrap',
              background: route === r ? 'var(--primary)' : 'transparent',
              color: route === r ? 'var(--primary-fg)' : 'var(--muted)',
              cursor: 'pointer', transition: 'background 0.15s ease, color 0.15s ease',
            }}
          >
            {label}
          </button>
        ))}
      </nav>

      {toastNode}

      <TweaksPanel>
        <TweakSection label="Theme"></TweakSection>
        <TweakSelect
          label="Profile theme"
          value={t.theme}
          options={[
            { value: 'soft-pixel-romance', label: 'Soft Pixel Romance' },
            { value: 'late-night-aim', label: 'Late Night AIM' },
            { value: 'cyber-cafe', label: 'Cyber Café' },
            { value: 'arcade-crush', label: 'Arcade Crush' },
            { value: 'dreamcast-summer', label: 'Dreamcast Summer' },
          ]}
          onChange={(v) => setTweak('theme', v)}
        ></TweakSelect>
        <TweakSlider label="Holo shimmer" value={t.holo} min={0} max={100} unit="%" onChange={(v) => setTweak('holo', v)}></TweakSlider>
        <TweakSection label="Type & space"></TweakSection>
        <TweakRadio label="Heading font" value={t.headingFont} options={['Baloo 2', 'Fredoka', 'Gabarito']} onChange={(v) => setTweak('headingFont', v)}></TweakRadio>
        <TweakRadio label="Spacing" value={t.spacing} options={['cozy', 'roomy', 'airy']} onChange={(v) => setTweak('spacing', v)}></TweakRadio>
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App></App>);
})();
</script>
</body>
</html>
